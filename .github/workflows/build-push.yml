name: build-and-push-hh-mcp

on:
  push:
    branches: [main]
    paths:
      - "hh_mcp_server.py"
      - "Dockerfile"
      - "requirements.txt"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Yandex Container Registry
        run: echo "${{ secrets.YC_OAUTH_TOKEN }}" | docker login cr.yandex --username oauth --password-stdin

      - name: Build and push
        run: |
          IMAGE="cr.yandex/${{ secrets.REGISTRY_ID }}/hh-mcp"
          docker build -t "$IMAGE:latest" .
          docker push "$IMAGE:latest"
