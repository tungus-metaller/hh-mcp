name: build-and-push-hh-mcp

on:
  push:
    branches: [main]
    paths:
      - "hh_mcp_server.py"
      - "Dockerfile"
      - "requirements.txt"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Login to Yandex Container Registry
        env:
          YC_JSON_KEY: ${{ secrets.YC_JSON_KEY }}
        run: echo "$YC_JSON_KEY" | docker login cr.yandex --username json_key --password-stdin

      - name: Build
        run: |
          IMAGE="cr.yandex/${{ secrets.REGISTRY_ID }}/hh-mcp"
          docker build --progress=plain -t "$IMAGE:latest" .

      - name: Push
        run: docker push "cr.yandex/${{ secrets.REGISTRY_ID }}/hh-mcp:latest"
